apiVersion: serving.knative.dev/v1
kind: Service
metadata: { name: room-booking-service }
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "3"
        autoscaling.knative.dev/maxScale: "12"
    spec:
      containers:
        - image: us-docker.pkg.dev/workplace/rooms/service:latest
          env:
            - { name: NODE_ENV, value: production }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: rooms-db, key: latest } } }
